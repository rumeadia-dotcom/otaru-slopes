<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오타루 슬로프</title>
  <meta name="description" content="오타루·삿포로 근교 5개 스키장(텐구야마·아사리가와·키로로·테이네·삿포로 국제)의 실제 슬로프를 3D 지형 위에 올려 보여 줍니다." />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="style.css?v=3" />
  <script type="importmap">{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="scene" class="scene" aria-label="스키장 3D 지형. 드래그로 회전, 휠·핀치로 확대, 슬로프를 짚으면 정보가 표시됩니다."></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 3D 위에 띄우는 표식 (정상·베이스 표고) -->
  <div class="marks" id="marks" aria-hidden="true">
    <p class="mark mark-top" id="markTop" hidden><b></b><span>정상</span></p>
    <p class="mark mark-base" id="markBase" hidden><b></b><span>베이스</span></p>
  </div>

  <header class="topbar">
    <a class="brand" href="#" id="brandHome" aria-label="오타루 슬로프 — 처음으로">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path class="b-aurora" d="M3 11c6-6 20-6 26 0" />
        <path class="b-mtn" d="M2 27 12 11l5 7 4-5 9 14Z" />
        <path class="b-snow" d="m12 11 2.6 4.2L17 18l-2 1.4-2.8-3.6L10 16Z" />
      </svg>
      <span>오타루 슬로프</span>
    </a>
    <nav class="resorts" id="resorts" aria-label="스키장 선택"></nav>
    <div class="tools">
      <button type="button" class="icon-btn" id="resetView" aria-label="시점 처음으로" title="시점 처음으로">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5" /><path d="M4 4v3h3" /></svg>
      </button>
    </div>
  </header>

  <button type="button" class="compass" id="compass" aria-label="북쪽이 위로 오게 회전" title="북쪽이 위로 오게">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" />
      <g id="compassNeedle"><path class="c-n" d="M20 5 24 20H16Z" /><path class="c-s" d="M20 35 16 20h8Z" /><text x="20" y="17.5">N</text></g>
    </svg>
  </button>

  <section class="hero" id="hero" aria-live="polite">
    <h1 id="heroTitle"><span class="sr-only" id="heroSr"></span><span aria-hidden="true" id="heroVis"></span></h1>
    <p class="hero-ja" id="heroJa"></p>
    <p class="hero-sub" id="heroSub"></p>
    <p class="hero-note" id="heroNote"></p>
  </section>

  <div class="tip" id="tip" role="status" aria-live="polite" hidden></div>

  <section class="dock" id="dock" aria-label="코스 목록">
    <div class="dock-head" id="dockHead">
      <div class="legend" id="legend">
        <span><i class="mark-easy"></i>초급</span>
        <span><i class="mark-inter"></i>중급</span>
        <span><i class="mark-adv"></i>상급</span>
        <span><i class="mark-lift"></i>리프트</span>
        <span class="legend-hint" id="legendHint"></span>
      </div>
      <div class="detail" id="detail" hidden>
        <p class="d-name"><i class="d-mark" id="dMark"></i><b id="dName"></b><span id="dSub"></span></p>
        <dl class="d-stats" id="dStats"></dl>
        <button type="button" class="icon-btn d-close" id="dClose" aria-label="선택 해제"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8M14 6l-8 8" /></svg></button>
      </div>
      <div class="rail-tools">
        <button type="button" class="icon-btn" id="railPrev" aria-label="이전 목록"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5 7 10l5 5" /></svg></button>
        <button type="button" class="icon-btn" id="railNext" aria-label="다음 목록"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5" /></svg></button>
        <button type="button" class="icon-btn" id="dockToggle" aria-expanded="true" aria-label="목록 접기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5" /></svg></button>
      </div>
    </div>
    <ol class="rail" id="rail"></ol>
  </section>

  <p class="credit" id="credit">표고 1.3배 강조 표시 · 지형 Mapzen / AWS Terrain Tiles · 코스·리프트 © OpenStreetMap contributors</p>
  <p class="toast" id="toast" role="status" hidden></p>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
